<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventory</title>

    <style>
        body {
            background-color: #0d1117;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            margin-top: 40px;
            width: 85%;
            background: #161b22;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0px 0px 25px rgba(0,0,0,0.6);
        }

        h1 {
            text-align: center;
            font-size: 34px;
            margin-bottom: 25px;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .add-btn {
            display: inline-block;
            background: #238636;
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            text-decoration: none;
            margin-bottom: 20px;
            font-size: 16px;
            font-weight: bold;
        }

        .add-btn:hover {
            background: #2ea043;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 18px;
            background-color: #0f1317;
        }

        th, td {
            border: 1px solid #30363d;
            padding: 14px;
            text-align: center;
            color: #e6edf3;
        }

        th {
            background-color: #21262d;
            color: #ffffff;
        }

        th a {
            color: #58a6ff;
            text-decoration: none;
        }

        tr:hover {
            background-color: #1b222a;
        }

        .edit-btn {
            background: #1f6feb;
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            text-decoration: none;
        }
        .edit-btn:hover {
            background: #388bfd;
        }

        .delete-btn {
            background: #d73a49;
            color: white;
            padding: 8px 15px;
            border-radius: 6px;
            text-decoration: none;
        }
        .delete-btn:hover {
            background: #f85149;
        }

        .pagination {
            text-align: center;
            margin-top: 20px;
        }

        .pagination a {
            padding: 8px 14px;
            margin: 5px;
            background: #30363d;
            color: #e6edf3;
            text-decoration: none;
            border-radius: 6px;
        }

        .pagination a:hover {
            background: #484f58;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Products List</h1>

    <a class="add-btn" href="/add">+ Add New Product</a>

    <table>
        <tr>
            <th>
                <a th:href="@{'/page/' + ${currentPage} + '?sortField=name&sortDir=' + ${reverseSortDir}}">
                    Name
                </a>
            </th>
            <th>Brand</th>
            <th>
                <a th:href="@{'/page/' + ${currentPage} + '?sortField=price&sortDir=' + ${reverseSortDir}}">
                    Price
                </a>
            </th>
            <th>Qty</th>
            <th>Actions</th>
        </tr>

        <tr th:each="p : ${products}">
            <td th:text="${p.name}"></td>
            <td th:text="${p.brand}"></td>
            <td th:text="${p.price}"></td>
            <td th:text="${p.quantity}"></td>
            <td>
                <a class="edit-btn" th:href="@{'/update/' + ${p.id}}">Edit</a>
                &nbsp;
                <a class="delete-btn" th:href="@{'/delete/' + ${p.id}}">Delete</a>
            </td>
        </tr>
    </table>

    <!-- Pagination -->
    <div class="pagination">
        <a th:if="${currentPage > 1}"
           th:href="@{'/page/' + (${currentPage - 1}) + '?sortField=' + ${sortField} + '&sortDir=' + ${sortDir}}">
            Prev
        </a>

        <a th:if="${currentPage < totalPages}"
           th:href="@{'/page/' + (${currentPage + 1}) + '?sortField=' + ${sortField} + '&sortDir=' + ${sortDir}}">
            Next
        </a>
    </div>

</div>

</body>
</html>
