<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update Product</title>

    <style>
        body {
            background-color: #0d1117;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 450px;
            background: #161b22;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
        }

        h1 {
            text-align: center;
            color: #ffffff;
            margin-bottom: 25px;
            font-size: 28px;
        }

        label {
            color: #e6edf3;
            font-size: 16px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0 18px 0;
            border: 1px solid #30363d;
            border-radius: 8px;
            background: #0d1117;
            color: #ffffff;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #58a6ff;
            box-shadow: 0px 0px 5px rgba(88,166,255,0.8);
        }

        .btn-save {
            width: 100%;
            background: #1f6feb;
            padding: 12px 18px;
            color: white;
            font-size: 17px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
        }

        .btn-save:hover {
            background: #388bfd;
        }

        .btn-back {
            display: block;
            text-align: center;
            margin-top: 18px;
            background: #30363d;
            padding: 10px;
            border-radius: 8px;
            color: #e6edf3;
            text-decoration: none;
        }

        .btn-back:hover {
            background: #484f58;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>Update Product</h1>

    <form th:action="@{/save}" method="post" th:object="${product}">

        <input type="hidden" th:field="*{id}">

        <label>Name</label>
        <input type="text" th:field="*{name}" required>

        <label>Brand</label>
        <input type="text" th:field="*{brand}" required>

        <label>Price</label>
        <input type="number" step="0.01" th:field="*{price}" required>

        <label>Quantity</label>
        <input type="number" th:field="*{quantity}" required>

        <button class="btn-save" type="submit">Update Product</button>

    </form>

    <a class="btn-back" href="/">← Back to Products</a>

</div>

</body>
</html>
