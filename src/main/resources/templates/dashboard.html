<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inventory Dashboard</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1117;
            font-family: Arial, sans-serif;
            display: flex;
            min-height: 100vh;
            color: #e6edf3;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background-color: #161b22;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0,0,0,0.4);
        }

        .sidebar h2 {
            text-align: center;
            margin-bottom: 30px;
            color: #58a6ff;
        }

        .sidebar a {
            display: block;
            padding: 15px;
            margin-bottom: 10px;
            background-color: #21262d;
            text-decoration: none;
            color: white;
            border-radius: 8px;
            font-size: 16px;
        }

        .sidebar a:hover {
            background-color: #30363d;
        }

        /* Main content */
        .main {
            flex: 1;
            padding: 30px;
        }

        /* Top bar */
        .topbar {
            background-color: #161b22;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            font-size: 20px;
            font-weight: bold;
            color: #58a6ff;
        }

        /* Cards */
        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            flex: 1;
            background-color: #161b22;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            font-size: 18px;
            box-shadow: 0 0 12px rgba(255,255,255,0.05);
        }

        .card h3 {
            font-size: 26px;
            color: #58a6ff;
        }

        .card p {
            font-size: 20px;
            margin-top: 10px;
        }

        /* Button */
        .add-btn {
            background: #238636;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 18px;
        }

        .add-btn:hover {
            background: #2ea043;
        }
    </style>
</head>

<body>

<!-- Sidebar -->
<div class="sidebar">
    <h2>Inventory</h2>

    <a href="/">🏠 Dashboard</a>
    <a href="/page/1?sortField=name&sortDir=asc">📦 Products List</a>
    <a href="/add">➕ Add Product</a>
</div>

<!-- Main Section -->
<div class="main">

    <div class="topbar">
        Inventory Dashboard
    </div>

    <!-- Cards -->
    <div class="cards">

        <div class="card">
            <h3>Total Products</h3>
            <p th:text="${totalItems}"></p>
        </div>

        <div class="card">
            <h3>Total Stock</h3>
            <p th:text="${#numbers.sum(products.?[quantity])}"></p>
        </div>

        <div class="card">
            <h3>Total Value (₹)</h3>
            <p th:text="${#numbers.sum(products.?[price * quantity])}"></p>
        </div>
    </div>

    <a href="/add" class="add-btn">+ Add New Product</a>

</div>

</body>
</html>
